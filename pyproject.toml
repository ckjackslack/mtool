[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mtool"
version = "0.2.0"
description = "Multi-tool handy command aggregator: file search, CSV stats, HTTP requests"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Maniak Root" }]
dependencies = []

[project.optional-dependencies]
gen = ["Faker>=18"]
server = ["Flask>=2.2"]
all = ["Faker>=18", "Flask>=2.2"]
dev = ["Faker>=18", "Flask>=2.2", "pytest>=7"]

[project.scripts]
mtool = "mtool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
